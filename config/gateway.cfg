# ib_fix gateway configuration: ib_fix_gateway gateway.cfg
# Paths are relative to this file. The FIX8 file (acceptor.xml) has its own paths, which FIX8
# takes relative to the working directory, so start the gateway from this directory:
#   cd config && mkdir -p run && ../build/src/ib_fix_gateway gateway.cfg

# TWS / IB Gateway API connection (TWS paper 7497, live 7496; IB Gateway paper 4002, live 4001)
host = 127.0.0.1
port = 7497
# must not be used by another API client of the same TWS
client_id = 1
connect_timeout_seconds = 10
# reconnect automatically if the connection to TWS is lost (backing off up to the max interval)
reconnect = true
reconnect_max_interval_seconds = 30

# account for orders that do not specify Account (tag 1); must be one of TWS's accounts.
# Required when the login has several accounts (e.g. an advisor's), or TWS rejects such orders.
account =

# FIX 4.2 acceptor
fix_config = acceptor.xml
fix_session = IBFIX
fix_global_log = run/fix8_global.log
