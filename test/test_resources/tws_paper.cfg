# TWS API connection for the live integration tests (test/TwsIntegrationTest.cpp).
# Points at a TWS paper trading session on this machine. The tests refuse to place orders
# unless every account TWS reports is a paper account (account ids starting with "D").

host = 127.0.0.1
# TWS paper trading API port (TWS live is 7496; IB Gateway is 4002 paper / 4001 live)
port = 7497
# any id not used by another API client connected to the same TWS
client_id = 4242
# account to trade in; leave empty to use TWS's default account
account =

# stock used for the test orders (resting orders are limit orders far below the market)
test.symbol = AAPL
# limit price for orders that must not fill
test.resting_price = 1.00
# seconds to wait for TWS to answer a request
test.timeout_seconds = 20
